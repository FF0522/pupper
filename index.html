<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuidPaw</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    :root {
      --bg: #0b1118;
      --panel-bg: rgba(18, 26, 36, 0.88);
      --line: rgba(52, 208, 182, 0.25);
      --teal: #34d0b6;
      --amber: #f5a623;
      --red: #e74c3c;
      --text: #e1e7ed;
      --muted: #7f93a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvasHolder {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: auto;
    }
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    /* HUD Layout Positions */
    #mapContainer { top: 16px; left: 16px; width: 230px; }
    #mapHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    #mapHeader h1 { font-size: 15px; font-weight: 800; color: var(--teal); letter-spacing: 0.5px; }
    #stateBadge {
      font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px;
      background: rgba(52, 208, 182, 0.15); color: var(--teal); border: 1px solid var(--teal);
    }
    #minimapCanvas {
      width: 100%; height: 160px; background: rgba(10, 16, 23, 0.9);
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); display: block;
    }
    .map-legend { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--muted); }
    .dot-legend { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }

    #storePanel { top: 16px; left: 260px; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100vw - 580px); }
    .store-btn {
      background: rgba(23, 35, 50, 0.85); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 12px;
      cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
    }
    .store-btn:hover { background: rgba(52, 208, 182, 0.2); border-color: var(--teal); color: #fff; }
    .store-btn.active { background: var(--teal); color: #0b1118; font-weight: bold; border-color: var(--teal); }

    #sensorPanel { top: 16px; right: 16px; width: 280px; }
    #sensorPanel h2 { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
    .row .v { font-weight: 700; color: #fff; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

    #telemetryPanel { bottom: 70px; right: 16px; width: 280px; }
    .pull-indicator {
      margin-top: 8px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center;
    }
    .arrow { font-size: 20px; color: var(--teal); transition: transform 0.3s ease; }
    .vibe-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .vibe-fill { height: 100%; width: 0%; background: var(--teal); transition: width 0.3s ease; }

    #btPanel { bottom: 70px; left: 16px; width: 320px; max-height: 180px; display: flex; flex-direction: column; }
    #btLog { font-family: monospace; font-size: 11px; color: #a0aec0; overflow-y: auto; height: 110px; display: flex; flex-direction: column-reverse; }

    #bottomBar { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; max-width: 92vw; justify-content: center; }
    button {
      font-family: inherit; font-size: 12px; color: var(--text); background: #172332; border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
    }
    button:hover { background: #223247; border-color: #55708a; }
    button:active { transform: scale(0.96); }
    button.danger { background: #4a1414; border-color: var(--red); color: #ff9999; }
    button.active { background: #0f3d36; border-color: var(--teal); color: var(--teal); }

    #guideAlertToast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(26, 36, 50, 0.95); border: 2px solid var(--amber); border-radius: 30px;
      padding: 10px 24px; display: flex; align-items: center; gap: 12px; z-index: 90;
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    #guideAlertToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #guideAlertToast .icon { font-size: 20px; }
    #guideAlertToast .msg { font-size: 13px; font-weight: bold; color: var(--text); letter-spacing: 0.5px; }

    #arrivalCard {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 340px; background: rgba(18, 26, 36, 0.96); border: 2px solid var(--teal);
      border-radius: 16px; padding: 24px; text-align: center; z-index: 100; display: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8); backdrop-filter: blur(16px);
    }
    #arrivalCard h3 { color: var(--teal); font-size: 18px; margin-bottom: 8px; }
    #arrivalCard p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  </style>
</head>
<body>

<div id="canvasHolder"></div>

<!-- Top-Left Mini-Map & Title HUD -->
<div class="hud panel" id="mapContainer">
  <div id="mapHeader">
    <h1>🐕 GuidPaw 實時導航</h1>
    <span id="stateBadge">IDLE</span>
  </div>
  <canvas id="minimapCanvas" width="200" height="160"></canvas>
  <div class="map-legend">
    <span><i class="dot-legend" style="background:#34d0b6"></i>GuidPaw</span>
    <span><i class="dot-legend" style="background:#f5a623"></i>目的地</span>
    <span><i class="dot-legend" style="background:#9b8cf2"></i>陸橋階梯</span>
    <span><i class="dot-legend" style="background:#e74c3c"></i>車輛</span>
  </div>
</div>

<!-- Target Store Navigation Selection -->
<div class="hud" id="storePanel">
  <button class="store-btn" data-target="cafe">☕ 暖陽咖啡館</button>
  <button class="store-btn" data-target="bakery">🍞 麥香烘焙坊</button>
  <button class="store-btn" data-target="overpass">🪜 景觀陸橋階梯</button>
  <button class="store-btn" data-target="mart">🏪 快捷便利商店</button>
  <button class="store-btn" data-target="pharmacy">💊 健康連鎖藥局</button>
  <button class="store-btn" data-target="park">🌳 微風陽光公園</button>
</div>

<!-- Real-time GuidPaw Action Warning Banner -->
<div id="guideAlertToast">
  <span class="icon" id="toastIcon">⚠️</span>
  <span class="msg" id="toastMsg">GuidPaw 發現前方障礙</span>
</div>

<!-- Right Sensor Telemetry Panel -->
<div class="hud panel" id="sensorPanel">
  <h2>GuidPaw 多感測器數據</h2>
  <div class="row"><span><i class="dot" id="dotForward" style="background:#34d0b6"></i>前方 LiDAR 雷達</span><span class="v" id="valForward">-- m</span></div>
  <div class="row"><span><i class="dot" id="dotDown" style="background:#34d0b6"></i>地面階梯 ToF</span><span class="v" id="valDown">-- m</span></div>
  <div class="row"><span><i class="dot" id="dotUp" style="background:#34d0b6"></i>AI 懸空視覺感測</span><span class="v" id="valUp">正常</span></div>
  <div class="row"><span>GuidPaw 提示狀態</span><span class="v" id="valDogState" style="color:var(--teal)">正常引導</span></div>
  <div class="row"><span>馬路過街燈號</span><span class="v" id="valLight">--</span></div>
</div>

<div class="hud panel" id="telemetryPanel">
  <h2>導盲牽繩體感反饋</h2>
  <div class="row"><span>總引向距離</span><span class="v" id="mDist">0.0 m</span></div>
  <div class="row"><span>距離目的地</span><span class="v" id="mTargetDist">-- m</span></div>
  <div class="pull-indicator">
    <div class="arrow" id="pullArrow">⬆️</div>
    <div style="font-size: 11px; margin-top: 4px; color: var(--muted);" id="pullLabel">待機中</div>
    <div class="vibe-bar"><div class="vibe-fill" id="vibeBarFill"></div></div>
  </div>
</div>

<div class="hud panel" id="btPanel">
  <div style="font-size: 11px; font-weight: bold; color: var(--teal); margin-bottom: 6px;">BLE 智慧牽繩連線日誌</div>
  <div id="btLog"></div>
</div>

<div class="hud" id="bottomBar">
  <button id="btnStairs">🪜 移至陸橋階梯段</button>
  <button id="btnRed">🚦 切換斑馬線紅燈</button>
  <button id="btnBranch">🌿 產生懸空招牌/樹枝</button>
  <button id="btnBarrier">🚧 施工道路圍籬</button>
  <button id="btnManual">🎮 WASD 手動操控</button>
  <button id="btnCamera">📷 切換視角 (隨狗/鳥瞰)</button>
  <button id="btnReset" class="danger">⚡ 重置位置</button>
</div>

<!-- Arrival Notification Overlay -->
<div id="arrivalCard">
  <h3 id="arrivalTitle">🎉 平安抵達目的地！</h3>
  <p id="arrivalDesc">GuidPaw 導盲犬已順利帶領您到達目的地。</p>
  <button onclick="document.getElementById('arrivalCard').style.display='none'" class="active" style="width: 100%;">確定</button>
</div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1017);
scene.fog = new THREE.FogExp2(0x0a1017, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 250);
camera.position.set(-3, 3.5, -6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvasHolder').appendChild(renderer.domElement);

const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
orbitControls.enabled = false;
orbitControls.enableDamping = true;

// Lighting Setup
const ambientLight = new THREE.AmbientLight(0x9cb0c5, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
sunLight.position.set(20, 35, -15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 150;
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 80;
sunLight.shadow.camera.bottom = -20;
scene.add(sunLight);

const STREET_START = -20;
const STREET_END = 130;
const SIDEWALK_X = -3.0;
const ROAD_CENTER_X = 3.5;
const WALKABLE_SURFACES = [];
const HAZARD_OBJECTS = [];

// Ground Base
const groundMat = new THREE.MeshStandardMaterial({ color: 0x142019, roughness: 0.95 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(250, STREET_END - STREET_START + 40), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.2, (STREET_START + STREET_END) / 2);
ground.receiveShadow = true;
scene.add(ground);

// Sidewalk Paving
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x727d88, roughness: 0.6 });
const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, STREET_END - STREET_START), sidewalkMat);
sidewalk.position.set(SIDEWALK_X, -0.15, (STREET_START + STREET_END) / 2);
sidewalk.receiveShadow = true;
scene.add(sidewalk);
WALKABLE_SURFACES.push(sidewalk);

// Staircase Overpass Parameters
const STAIR_START_Z = 32.0;
const STAIR_HEIGHT = 1.3;
const STAIR_COUNT = 8;
const STAIR_STEP_DEPTH = 0.4;
const PLATFORM_LENGTH = 5.0;

const stairMat = new THREE.MeshStandardMaterial({ color: 0x505c69, roughness: 0.5 });
const stairSideMat = new THREE.MeshStandardMaterial({ color: 0x3a4550, roughness: 0.6 });
const tactileWarningMat = new THREE.MeshStandardMaterial({ color: 0xe65100, roughness: 0.3 });
const railMat = new THREE.MeshStandardMaterial({ color: 0x34d0b6, metalness: 0.8, roughness: 0.2 });
const postMat = new THREE.MeshStandardMaterial({ color: 0x22303d, metalness: 0.5 });
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2d3844, roughness: 0.7 });

const OVERPASS_PLATFORM_Z = STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH + PLATFORM_LENGTH / 2;
const DOWN_STAIR_START_Z = STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH + PLATFORM_LENGTH;
const DOWN_STAIR_END_Z = DOWN_STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH;

// Overpass Support Pillars (Ground to Platform deck)
const pillar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, STAIR_HEIGHT, 16), pillarMat);
pillar1.position.set(SIDEWALK_X - 1.3, STAIR_HEIGHT / 2 - 0.15, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH + 0.3);
pillar1.castShadow = true;
scene.add(pillar1);

const pillar2 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, STAIR_HEIGHT, 16), pillarMat);
pillar2.position.set(SIDEWALK_X + 1.3, STAIR_HEIGHT / 2 - 0.15, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH + 0.3);
pillar2.castShadow = true;
scene.add(pillar2);

const pillar3 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, STAIR_HEIGHT, 16), pillarMat);
pillar3.position.set(SIDEWALK_X - 1.3, STAIR_HEIGHT / 2 - 0.15, DOWN_STAIR_START_Z - 0.3);
pillar3.castShadow = true;
scene.add(pillar3);

const pillar4 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, STAIR_HEIGHT, 16), pillarMat);
pillar4.position.set(SIDEWALK_X + 1.3, STAIR_HEIGHT / 2 - 0.15, DOWN_STAIR_START_Z - 0.3);
pillar4.castShadow = true;
scene.add(pillar4);

// 1. Up Stairs Steps & Solid Skirt
for (let i = 0; i < STAIR_COUNT; i++) {
  const stepH = (STAIR_HEIGHT / STAIR_COUNT) * (i + 1);
  const stepZ = STAIR_START_Z + i * STAIR_STEP_DEPTH + STAIR_STEP_DEPTH / 2;
  const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, stepH, STAIR_STEP_DEPTH), stairMat);
  stepMesh.position.set(SIDEWALK_X, stepH / 2 - 0.15, stepZ);
  stepMesh.castShadow = true;
  stepMesh.receiveShadow = true;
  scene.add(stepMesh);
  WALKABLE_SURFACES.push(stepMesh);
}

// Up Stairs Side Stringers (Walls under steps)
const upStringer = new THREE.Mesh(new THREE.BoxGeometry(3.3, STAIR_HEIGHT, STAIR_COUNT * STAIR_STEP_DEPTH), stairSideMat);
upStringer.position.set(SIDEWALK_X, STAIR_HEIGHT / 2 - 0.25, STAIR_START_Z + (STAIR_COUNT * STAIR_STEP_DEPTH) / 2);
upStringer.castShadow = true;
scene.add(upStringer);

// 2. Main Overpass Deck
const platformDeck = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.25, PLATFORM_LENGTH), stairMat);
platformDeck.position.set(SIDEWALK_X, STAIR_HEIGHT - 0.125, OVERPASS_PLATFORM_Z);
platformDeck.castShadow = true;
platformDeck.receiveShadow = true;
scene.add(platformDeck);
WALKABLE_SURFACES.push(platformDeck);

// 3. Down Stairs Steps & Solid Rear Skirt Modeling (FIXED: Complete Rear Staircase Structural Fill)
for (let i = 0; i < STAIR_COUNT; i++) {
  const stepH = STAIR_HEIGHT - (STAIR_HEIGHT / STAIR_COUNT) * i;
  const stepZ = DOWN_STAIR_START_Z + i * STAIR_STEP_DEPTH + STAIR_STEP_DEPTH / 2;
  const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(3.2, stepH, STAIR_STEP_DEPTH), stairMat);
  stepMesh.position.set(SIDEWALK_X, stepH / 2 - 0.15, stepZ);
  stepMesh.castShadow = true;
  stepMesh.receiveShadow = true;
  scene.add(stepMesh);
  WALKABLE_SURFACES.push(stepMesh);
}

// Down Stairs Solid Skirt/Wall Base (Structural fill behind stairs)
const downStringer = new THREE.Mesh(new THREE.BoxGeometry(3.3, STAIR_HEIGHT, STAIR_COUNT * STAIR_STEP_DEPTH), stairSideMat);
downStringer.position.set(SIDEWALK_X, STAIR_HEIGHT / 2 - 0.25, DOWN_STAIR_START_Z + (STAIR_COUNT * STAIR_STEP_DEPTH) / 2);
downStringer.castShadow = true;
scene.add(downStringer);

// Full Length Continuous Handrails & Balusters
function createHandrailSection(startX, startY, startZ, endX, endY, endZ) {
  const dx = endX - startX, dy = endY - startY, dz = endZ - startZ;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  
  const railGroup = new THREE.Group();
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len, 12), railMat);
  rail.position.set(startX + dx/2, startY + dy/2, startZ + dz/2);
  
  // Rotate to align along direction vector
  const axis = new THREE.Vector3(0, 1, 0);
  const dir = new THREE.Vector3(dx, dy, dz).normalize();
  const quaternion = new THREE.Quaternion().setFromUnitVectors(axis, dir);
  rail.quaternion.copy(quaternion);
  railGroup.add(rail);

  // Add Vertical Support Posts along rail
  const postCount = Math.max(2, Math.floor(len / 1.2));
  for (let i = 0; i <= postCount; i++) {
    const t = i / postCount;
    const px = startX + dx * t;
    const py = startY + dy * t;
    const pz = startZ + dz * t;
    
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8), postMat);
    post.position.set(px, py - 0.45, pz);
    railGroup.add(post);
  }
  scene.add(railGroup);
}

// Up Handrails (Left & Right)
createHandrailSection(SIDEWALK_X - 1.5, 0.9, STAIR_START_Z, SIDEWALK_X - 1.5, STAIR_HEIGHT + 0.9, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH);
createHandrailSection(SIDEWALK_X + 1.5, 0.9, STAIR_START_Z, SIDEWALK_X + 1.5, STAIR_HEIGHT + 0.9, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH);

// Deck Handrails (Left & Right)
createHandrailSection(SIDEWALK_X - 1.5, STAIR_HEIGHT + 0.9, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH, SIDEWALK_X - 1.5, STAIR_HEIGHT + 0.9, DOWN_STAIR_START_Z);
createHandrailSection(SIDEWALK_X + 1.5, STAIR_HEIGHT + 0.9, STAIR_START_Z + STAIR_COUNT * STAIR_STEP_DEPTH, SIDEWALK_X + 1.5, STAIR_HEIGHT + 0.9, DOWN_STAIR_START_Z);

// Down Handrails (Left & Right)
createHandrailSection(SIDEWALK_X - 1.5, STAIR_HEIGHT + 0.9, DOWN_STAIR_START_Z, SIDEWALK_X - 1.5, 0.9, DOWN_STAIR_END_Z);
createHandrailSection(SIDEWALK_X + 1.5, STAIR_HEIGHT + 0.9, DOWN_STAIR_START_Z, SIDEWALK_X + 1.5, 0.9, DOWN_STAIR_END_Z);

// Tactile Warning Strips
const upLandingTactile = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.04, 0.6), tactileWarningMat);
upLandingTactile.position.set(SIDEWALK_X, 0.02, STAIR_START_Z - 0.5);
scene.add(upLandingTactile);

const topLandingTactile = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.04, 0.6), tactileWarningMat);
topLandingTactile.position.set(SIDEWALK_X, STAIR_HEIGHT + 0.02, DOWN_STAIR_START_Z - 0.3);
scene.add(topLandingTactile);

const downLandingTactile = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.04, 0.6), tactileWarningMat);
downLandingTactile.position.set(SIDEWALK_X, 0.02, DOWN_STAIR_END_Z + 0.5);
scene.add(downLandingTactile);

// Tactile Paving Tiles along Sidewalk
const tactileMat = new THREE.MeshStandardMaterial({ color: 0xeba823, roughness: 0.4 });
for (let z = STREET_START; z <= STREET_END; z += 0.8) {
  if (z >= STAIR_START_Z - 0.5 && z <= DOWN_STAIR_END_Z + 0.8) continue;
  const tile = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.03, 0.7), tactileMat);
  tile.position.set(SIDEWALK_X, 0.01, z);
  tile.receiveShadow = true;
  scene.add(tile);
  WALKABLE_SURFACES.push(tile);
}

// Road Surface
const roadMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.8 });
const road = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.1, STREET_END - STREET_START), roadMat);
road.position.set(ROAD_CENTER_X, -0.05, (STREET_START + STREET_END) / 2);
road.receiveShadow = true;
scene.add(road);

// Store Definitions
const STORES = {
  cafe: { name: '暖陽咖啡館', z: 10.0, color: 0x8c6747, signColor: 0xffaa44, targetX: SIDEWALK_X - 1.2, icon: '☕' },
  bakery: { name: '麥香烘焙坊', z: 22.0, color: 0xb58c4c, signColor: 0xffd166, targetX: SIDEWALK_X - 1.2, icon: '🍞' },

function drawMinimap() {
  const canvas = document.getElementById('minimapCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  const minZ = -15, maxZ = 125;
  const minX = -12, maxX = 8;

  function toMapX(x) { return ((x - minX) / (maxX - minX)) * w; }
  function toMapY(z) { return ((z - minZ) / (maxZ - minZ)) * h; }

  // Sidewalk region
  const swX1 = toMapX(-4.8);
  const swX2 = toMapX(-1.2);
  ctx.fillStyle = 'rgba(114, 125, 136, 0.35)';
  ctx.fillRect(swX1, 0, swX2 - swX1, h);

  // Stair overpass region on mini-map
  const stairY1 = toMapY(STAIR_START_Z);
  const stairY2 = toMapY(DOWN_STAIR_END_Z);
  ctx.fillStyle = 'rgba(155, 140, 242, 0.45)';
  ctx.fillRect(swX1, stairY1, swX2 - swX1, stairY2 - stairY1);

  // Road region
  const rX1 = toMapX(0.5);
  const rX2 = toMapX(6.5);
  ctx.fillStyle = 'rgba(33, 37, 41, 0.7)';
  ctx.fillRect(rX1, 0, rX2 - rX1, h);

  // Road center line
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  const cX = toMapX(ROAD_CENTER_X);
  ctx.moveTo(cX, 0);
  ctx.lineTo(cX, h);
  ctx.stroke();
  ctx.setLineDash([]);

  // Crosswalk Z=52
  const cwY = toMapY(52);
  ctx.fillStyle = 'rgba(240, 240, 240, 0.75)';
  ctx.fillRect(swX1, cwY - 3, rX2 - swX1, 6);

  // Target Navigation Route Line
  if (activeTargetKey && STORES[activeTargetKey]) {
    const target = STORES[activeTargetKey];
    ctx.strokeStyle = '#34d0b6';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(toMapX(pupper.position.x), toMapY(pupper.position.z));
    ctx.lineTo(toMapX(target.targetX), toMapY(target.z));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Stores on mini-map
  Object.keys(STORES).forEach(key => {
    const store = STORES[key];
    const sx = toMapX(-7.5);
    const sy = toMapY(store.z);
    const isTarget = (key === activeTargetKey);

    if (isTarget) {
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(52, 208, 182, 0.35)';
      ctx.fill();
    }

    ctx.fillStyle = isTarget ? '#34d0b6' : (key === 'overpass' ? '#9b8cf2' : '#f5a623');
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isTarget ? '#34d0b6' : '#a0b0c0';
    ctx.font = '9px sans-serif';
    ctx.fillText(store.name, sx + 7, sy + 3);
  });

  // Vehicles on mini-map
  vehicles.forEach(v => {
    const vx = toMapX(v.mesh.position.x);
    const vy = toMapY(v.mesh.position.z);
    ctx.fillStyle = v.lane === 1 ? '#e74c3c' : '#f1c40f';
    ctx.fillRect(vx - 2, vy - 3, 4, 6);
  });

  // GuidPaw Location & Heading Cone
  const px = toMapX(pupper.position.x);
  const py = toMapY(pupper.position.z);

  ctx.fillStyle = 'rgba(52, 208, 182, 0.35)';
  ctx.beginPath();
  ctx.moveTo(px, py);
  const radAngle = pupper.rotation.y + Math.PI / 2;
  ctx.arc(px, py, 14, radAngle - 0.45, radAngle + 0.45);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#34d0b6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px, py, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function updateNavigation(delta) {
  const posZ = pupper.position.z;
  const posX = pupper.position.x;

  const forwardDir = new THREE.Vector3(0, 0, 1).applyQuaternion(pupper.quaternion);
  const sensorFrontPos = pupper.position.clone().add(new THREE.Vector3(0, 0.25, 0)).add(forwardDir.clone().multiplyScalar(0.2));
  raycaster.set(sensorFrontPos, forwardDir);
  
  const rayTargets = [...HAZARD_OBJECTS];
  if (pole) rayTargets.push(pole);
  const forwardHits = raycaster.intersectObjects(rayTargets, true);
  const forwardDist = forwardHits.length ? forwardHits[0].distance : 5.0;

  // Ground elevation Raycast for Stair Elevation Calculation
  const downOrigin = pupper.position.clone().add(forwardDir.clone().multiplyScalar(0.35)).add(new THREE.Vector3(0, 0.6, 0));
  raycaster.set(downOrigin, new THREE.Vector3(0, -1, 0));
  const groundHits = raycaster.intersectObjects(WALKABLE_SURFACES, true);
  
  let currentSurfaceY = 0.0;
  if (groundHits.length > 0) {
    currentSurfaceY = groundHits[0].point.y;
  }
  
  pupper.position.y += (currentSurfaceY + 0.05 - pupper.position.y) * Math.min(1.0, delta * 12.0);

  // Staircase & Proximity Conditions
  const isApproachingUpStairs = (posZ >= STAIR_START_Z - 1.2 && posZ < STAIR_START_Z - 0.1);
  const isApproachingDownStairs = (posZ >= DOWN_STAIR_START_Z - 0.6 && posZ < DOWN_STAIR_START_Z + 0.2);
  const isApproachingCrosswalk = (posZ >= 47.0 && posZ < 50.5);
  const isRedLightBlocking = isApproachingCrosswalk && (trafficLight.state === 'RED');

  let isOverheadAhead = false;
  if (activeSignObstacle && Math.abs(posZ - (pupper.position.z + 3.5)) < 1.8) {
    isOverheadAhead = true;
  }

  let nextState = 'IDLE';

  if (isApproachingUpStairs) {
    nextState = 'ALERT_STAIRS_UP';
  } else if (isApproachingDownStairs) {
    nextState = 'ALERT_STAIRS_DOWN';
  } else if (activeBarrierObstacle && forwardDist < 1.5) {
    nextState = 'ALERT_CONSTRUCTION';
  } else if (isRedLightBlocking) {
    nextState = 'WAIT_RED_LIGHT';
  } else if (isOverheadAhead) {
    nextState = 'OBSTACLE_AVOID';
  } else if (manualControl) {
    nextState = 'NAVIGATING';
  } else if (activeTargetKey) {
    const targetStore = STORES[activeTargetKey];
    const distToTarget = Math.abs(posZ - targetStore.z);

    if (distToTarget < 0.6 && Math.abs(posX - targetStore.targetX) < 0.5) {
      nextState = 'ARRIVED';
      if (!arrivalAlertShown) {
        arrivalAlertShown = true;
        document.getElementById('arrivalTitle').textContent = `🎉 平安抵達 ${targetStore.name}！`;
        document.getElementById('arrivalDesc').textContent = `GuidPaw 導盲犬已順利引導您到達 ${targetStore.name} 前門處。`;
        document.getElementById('arrivalCard').style.display = 'block';
        logBt(`抵達目的地：${targetStore.name}`);
      }
    } else {
      nextState = 'NAVIGATING';
    }
  }

  // Trigger State Changes & GuidPaw Hazard Alerts
  if (nextState !== currentState) {
    currentState = nextState;
    stairPauseTimer = 1.8;

    if (currentState === 'ALERT_STAIRS_UP') {
      showToastAlert('🪜', '前方上階梯！GuidPaw 停步示警（請準備踏上第一階）');
      logBt('【GuidPaw 警示】發現上行階梯！抬頭示警');
    } else if (currentState === 'ALERT_STAIRS_DOWN') {
      showToastAlert('⚠️', '前方下階梯！GuidPaw 停步示警（請注意腳下）');
      logBt('【GuidPaw 警示】發現下行階梯！於邊緣停步低頭');
    } else if (currentState === 'ALERT_CONSTRUCTION') {
      showToastAlert('🚧', '發現道路施工圍籬！GuidPaw 帶領繞行');
      logBt('【GuidPaw 警示】前方施工圍籬，啟動安全避障引導');
    } else if (currentState === 'WAIT_RED_LIGHT') {
      showToastAlert('🚦', '紅燈停等！GuidPaw 斑馬線前停步');
      logBt('【GuidPaw 警示】過街紅燈，於路緣停步等候');
    } else if (currentState === 'OBSTACLE_AVOID') {
      showToastAlert('🌿', '發現低垂懸空障礙！GuidPaw 側向帶領避讓');
    }
  }

  let moving = false;

  if (stairPauseTimer > 0) {
    stairPauseTimer -= delta;
  }

  if (manualControl) {
    if (keys['a']) pupper.position.x -= 1.6 * delta;
    if (keys['d']) pupper.position.x += 1.6 * delta;
    if (keys['w']) { pupper.position.z += MOVE_SPEED * delta; moving = true; }
  } else if ((currentState === 'NAVIGATING' || currentState === 'OBSTACLE_AVOID' || currentState === 'ALERT_CONSTRUCTION' || currentState === 'ALERT_STAIRS_UP' || currentState === 'ALERT_STAIRS_DOWN') && stairPauseTimer <= 0) {
    let desiredX = SIDEWALK_X;
    let desiredZ = posZ;

    if (activeTargetKey) {
      const t = STORES[activeTargetKey];
      if (Math.abs(posZ - t.z) < 2.5) {
        desiredX = t.targetX;
      }
      desiredZ = t.z;
    }

    if (isOverheadAhead) { desiredX = SIDEWALK_X - 0.9; }
    if (currentState === 'ALERT_CONSTRUCTION') { desiredX = SIDEWALK_X + 0.8; }

    const deltaZ = desiredZ - posZ;
    const deltaX = desiredX - posX;

    if (Math.abs(deltaZ) > 0.25 || Math.abs(deltaX) > 0.25) {
      if (Math.abs(deltaZ) > 0.25) {
        pupper.position.z += Math.sign(deltaZ) * MOVE_SPEED * delta;
      }
      moving = true;
    }

    pupper.position.x += deltaX * Math.min(1.0, delta * 3.0);

    const targetAngle = Math.atan2(deltaX, deltaZ);
    let angleDiff = targetAngle - pupper.rotation.y;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    pupper.rotation.y += angleDiff * Math.min(1.0, delta * 6.0);
  } else {
    pupper.rotation.y += (0 - pupper.rotation.y) * Math.min(1.0, delta * 4.0);
  }

  pupper.position.x = Math.max(-4.5, Math.min(-1.2, pupper.position.x));

  if (moving) {
    const stepDist = pupper.position.distanceTo(telemetry.lastPos);
    telemetry.totalDistance += stepDist;
    telemetry.lastPos.copy(pupper.position);
  }

  // Dog Walking Gait Animation
  if (moving) { gaitTime += delta * 9; } else { gaitTime += (0 - gaitTime) * 0.1; }
  legs.forEach(leg => {
    leg.hip.rotation.x = moving ? Math.sin(gaitTime + leg.phase) * 0.5 : 0;
  });
  torsoGroup.position.y = moving ? Math.abs(Math.sin(gaitTime * 2)) * 0.025 : 0;

  // GuidPaw Head Alert Pose
  if (currentState === 'ALERT_STAIRS_UP') {
    dogHead.rotation.x = -0.35;
  } else if (currentState === 'ALERT_STAIRS_DOWN') {
    dogHead.rotation.x = 0.45;
  } else {
    dogHead.rotation.x = 0;
  }

  function setLine(line, from, to, color) {
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, from.x, from.y, from.z);
    pos.setXYZ(1, to.x, to.y, to.z);
    pos.needsUpdate = true;
    line.material.color.set(color);
  }
  setLine(rayForwardLine, sensorFrontPos, sensorFrontPos.clone().add(forwardDir.clone().multiplyScalar(forwardDist)), forwardDist < 1.2 ? 0xe85252 : 0x34d0b6);
  setLine(rayDownLine, downOrigin, downOrigin.clone().add(new THREE.Vector3(0, -1.0, 0)), 0x34d0b6);

  return { forwardDist, downDist: currentSurfaceY, isRedLightBlocking, isOverheadAhead };
}

function updateHUD(info) {
  const badge = document.getElementById('stateBadge');
  badge.textContent = currentState;
  
  const dogStateLabel = document.getElementById('valDogState');
  if (currentState.includes('STAIRS_UP')) {
    dogStateLabel.textContent = '🪜 上階梯停步示警';
    dogStateLabel.style.color = '#9b8cf2';
  } else if (currentState.includes('STAIRS_DOWN')) {
    dogStateLabel.textContent = '⚠️ 下階梯緣停步示警';
    dogStateLabel.style.color = '#f5a623';
  } else if (currentState === 'ALERT_CONSTRUCTION') {
    dogStateLabel.textContent = '🚧 施工圍籬避障';
    dogStateLabel.style.color = '#e67e22';
  } else if (currentState === 'WAIT_RED_LIGHT') {
    dogStateLabel.textContent = '🚦 紅燈停等';
    dogStateLabel.style.color = '#e74c3c';
  } else {
    dogStateLabel.textContent = '正常引導中';
    dogStateLabel.style.color = '#34d0b6';
  }

  badge.style.borderColor = currentState === 'NAVIGATING' ? '#34d0b6' : '#f5a623';
  badge.style.color = currentState === 'NAVIGATING' ? '#34d0b6' : '#f5a623';

  document.getElementById('valForward').textContent = info.forwardDist.toFixed(2) + ' m';
  document.getElementById('valDown').textContent = info.downDist.toFixed(2) + ' m';
  document.getElementById('valUp').textContent = info.isOverheadAhead ? '發現懸空障礙！' : '正常';
  document.getElementById('valLight').textContent = trafficLight.state === 'GREEN' ? '綠燈 (安全過街)' : '紅燈 (停等車流)';

  document.getElementById('mDist').textContent = telemetry.totalDistance.toFixed(1) + ' m';
  
  if (activeTargetKey) {
    const targetZ = STORES[activeTargetKey].z;
    const remain = Math.max(0, Math.abs(pupper.position.z - targetZ)).toFixed(1);
    document.getElementById('mTargetDist').textContent = remain + ' m';
  } else {
    document.getElementById('mTargetDist').textContent = '-- m';
  }

  const arrow = document.getElementById('pullArrow');
  const vibeFill = document.getElementById('vibeBarFill');
  const pullLabel = document.getElementById('pullLabel');

  if (currentState === 'ALERT_STAIRS_UP') {
    arrow.style.transform = 'rotate(-90deg)';
    vibeFill.style.width = '75%';
    vibeFill.style.background = '#9b8cf2';
    pullLabel.textContent = '牽繩雙短脈衝（上階梯示警）';
  } else if (currentState === 'ALERT_STAIRS_DOWN') {
    arrow.style.transform = 'rotate(90deg)';
    vibeFill.style.width = '90%';
    vibeFill.style.background = '#f5a623';
    pullLabel.textContent = '牽繩三長脈衝（下階梯邊緣示警）';
  } else if (currentState === 'ALERT_CONSTRUCTION') {
    arrow.style.transform = 'rotate(45deg)';
    vibeFill.style.width = '80%';
    vibeFill.style.background = '#e67e22';
    pullLabel.textContent = '牽繩右側引導（繞過施工圍籬）';
  } else if (currentState === 'OBSTACLE_AVOID') {
    arrow.style.transform = 'rotate(-35deg)';
    vibeFill.style.width = '85%';
    vibeFill.style.background = '#e8735d';
    pullLabel.textContent = '牽繩向左避障引導';
  } else if (currentState === 'WAIT_RED_LIGHT') {
    arrow.style.transform = 'rotate(0deg)';
    vibeFill.style.width = '40%';
    vibeFill.style.background = '#f5a623';
    pullLabel.textContent = '輕微脈衝（停等紅燈）';
  } else if (currentState === 'NAVIGATING') {
    arrow.style.transform = 'rotate(0deg)';
    vibeFill.style.width = '15%';
    vibeFill.style.background = '#34d0b6';
    pullLabel.textContent = '穩定前行引導';
  } else {
    arrow.style.transform = 'rotate(0deg)';
    vibeFill.style.width = '0%';
    pullLabel.textContent = '待機中';
  }
}

function updateCamera(delta) {
  if (birdView) {
    orbitControls.update();
    return;
  }
  const desired = pupper.position.clone().add(new THREE.Vector3(0, 2.5, -4.8));
  camera.position.lerp(desired, Math.min(1, delta * 5));
  camera.lookAt(pupper.position.clone().add(new THREE.Vector3(0, 0.4, 1.8)));
}

// UI Event Listeners
document.querySelectorAll('.store-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetKey = btn.getAttribute('data-target');
    activeTargetKey = targetKey;
    arrivalAlertShown = false;
    document.getElementById('arrivalCard').style.display = 'none';
    document.querySelectorAll('.store-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    logBt(`設定 GuidPaw 導航目標：${STORES[targetKey].name}`);
  });
});

document.getElementById('btnStairs').addEventListener('click', () => {
  pupper.position.set(SIDEWALK_X, 0.05, STAIR_START_Z - 3.0);
  pupper.rotation.set(0, 0, 0);
  logBt('快速移動至「景觀陸橋階梯」入口準備測試 GuidPaw 階梯警示');
});

document.getElementById('btnBarrier').addEventListener('click', () => {
  toggleConstructionBarrier();
});

document.getElementById('btnBranch').addEventListener('click', () => {
  toggleOverheadSign();
});

document.getElementById('btnManual').addEventListener('click', (e) => {
  manualControl = !manualControl;
  e.target.classList.toggle('active', manualControl);
  logBt(manualControl ? '切換至 WASD 手動操控模式' : '切換至 GuidPaw AI 自動導航模式');
});

document.getElementById('btnRed').addEventListener('click', () => {
  trafficLight.manualOverrideUntil = performance.now() + 8000;
  trafficLight.state = trafficLight.state === 'RED' ? 'GREEN' : 'RED';
  logBt(`手動切換斑馬線燈號為：${trafficLight.state}`);
});

document.getElementById('btnCamera').addEventListener('click', () => {
  birdView = !birdView;
  orbitControls.enabled = birdView;
  if (birdView) {
    camera.position.set(-3, 22, 35);
    camera.lookAt(-3, 0, 35);
  }
  logBt(birdView ? '切換至鳥瞰視角 (可滑鼠旋轉)' : '切換至第一人稱跟隨視角');
});

document.getElementById('btnReset').addEventListener('click', () => {
  pupper.position.set(SIDEWALK_X, 0.05, 0);
  pupper.rotation.set(0, 0, 0);
  activeTargetKey = null;
  arrivalAlertShown = false;
  document.getElementById('arrivalCard').style.display = 'none';
  document.querySelectorAll('.store-btn').forEach(b => b.classList.remove('active'));
  logBt('GuidPaw 導盲系統已重置至初始位置');
});

const clock = new THREE.Clock();
let gaitTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  if (performance.now() > trafficLight.manualOverrideUntil) {
    trafficLight.autoTimer += delta;
    const cycle = trafficLight.autoTimer % 12;
    trafficLight.state = cycle < 6 ? 'GREEN' : (cycle < 7 ? 'YELLOW' : 'RED');
  }
  updateTrafficLightVisual();

  updateVehicles(delta);
  const navInfo = updateNavigation(delta);
  updateCamera(delta);
  updateHUD(navInfo);
  drawMinimap();

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

logBt('GuidPaw 導盲犬 AI 模擬導航系統初始化完畢！');
</script>
</body>
</html>
